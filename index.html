<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign-up form</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div>
            <img src="images/odin-lined.png" alt="logo-img" />
            <h1 class="logo">ODIN</h1>
        </div>
    </header>

    

    <main>

        <div class="brand-description">
            <p>
                This is not a real online service! You know you need something like
                this in your life to help you realize your deepest dreams. <br>Sign up now
                to get started
            </p>
            <p>You <em>know</em> you want to.</p>
        </div>

        <section>
            <p class="form-CTA">Let's do this!</p>
            <form action="#" id="sign-up">


                <div class="form-div">
                    <label for="fname">FIRST NAME</label><br />
                    <input type="text" id="fname" name="fname" value="John" /><br />
                </div>

                <div class="form-div">
                    <label for="lname">LAST NAME</label><br />
                    <input type="text" id="lname" name="lname" value="Doe" /><br />
                </div>

                <div class="form-div">
                    <label for="email">EMAIL</label><br />
                    <input type="email" id="email" name="email" /> <br />
                </div>

                <div class="form-div">
                    <label for="phone">PHONE NUMBER</label> <br />
                    <input type="tel" id="phone" name="phone" value="" /><br />
                </div>

                <div class="form-div">
                    <label for="pwd">PASSWORD</label><br />
                    <input type="password" id="pwd" name="pwd" pattern=".{8,}" /> <br />
                </div>

                <div class="form-div">
                    <label for="confirm_pwd">CONFIRM PASSWORD</label><br />
                    <input type="password" id="confirm_pwd" name="confirm_pwd" pattern=".{8,}" /> <br />
                </div>
            </form>
        </section>

        <div class="user-account">
            <button type="submit" form="sign-up" id="submit"> Create Account</button>
            <p> Already have an account? <a href="#">Log in</a></p>
        </div>
    </main>

    <footer>Photo by <a href="#"> Halie West </a> on <a href="#">Unsplash</a></footer>




</body>

</html>
